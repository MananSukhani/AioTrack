[package]
name = "aiotrack"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
authors = ["Manan Sukhani"]
description = "A calm, private daily expense tracker and account manager."
license = "MIT"

[lib]
name = "aiotrack"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "aiotrack"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "=0.31.1", default-features = false, features = [
  "default_fonts",
  "glow",
  "android-native-activity",
] }
winit = { version = "0.30.7", default-features = false, features = ["android-native-activity"] }
android-activity = "0.6"
jni = "0.22"
android_logger = "0.14"
log = "0.4"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "=0.31.1", default-features = false, features = [
  "default_fonts",
  "glow",
  "x11",
  "wayland",
] }

[package.metadata.android]
package = "com.manansukhani.aiotrack"
apk_name = "AioTrack"
resources = "android/res"
build_targets = ["armv7-linux-androideabi", "aarch64-linux-android"]
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
theme = "@style/AppTheme"
icon = "@mipmap/ic_launcher"
label = "AioTrack"
debuggable = false
extract_native_libs = true

[package.metadata.android.application.activity]
orientation = "portrait"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode"
exported = true

[patch.crates-io]
# Small local patch so Android's Back key (winit `NamedKey::BrowserBack`) is
# delivered to egui as `Escape`, letting the app unwind one screen at a time.
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
debug = false
